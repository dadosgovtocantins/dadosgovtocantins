    retry_count: 3
    retry_interval: "10m"
    timeout: "10m"
    command: "python -m src.cli coletar --fonte TO-REC-01 --ambiente prod"

  # ─── SICONFI DCA Receita Corrente Líquida (Anual) ────────────────
  - name: coletor-to-rec-02-siconfi
    id_fonte: "TO-REC-02"
    schedule: "0 4 1 5 *"        # 1º de maio às 04h
    timezone: "America/Araguaina"

# Cloud Scheduler — Bloco IBGE (Task 08) + Educação e Trabalho (Task 10)
# Um job independente por fonte. Falha de uma fonte não derruba as outras (RF-68).
# Periodicidade conforme o catálogo.

schedulers:
  # ─── População Residente (Anual) ─────────────────────────────────
  - name: coletor-to-ter-01-populacao
    id_fonte: "TO-TER-01"
    schedule: "0 3 1 7 *"        # 1º de julho às 03h (publicação IBGE ~julho)
    timezone: "America/Araguaina"
    retry_count: 3
    retry_interval: "10m"
    timeout: "10m"
    command: "python -m src.cli coletar --fonte TO-TER-01 --ambiente prod"

  # ─── PIB Municipal (Anual) ───────────────────────────────────────
  - name: coletor-to-ter-02-pib-municipal
    id_fonte: "TO-TER-02"
    schedule: "0 3 15 12 *"      # 15 de dezembro às 03h (publicação ~dez)
    timezone: "America/Araguaina"
    retry_count: 3
    retry_interval: "10m"
    timeout: "10m"
    command: "python -m src.cli coletar --fonte TO-TER-02 --ambiente prod"

  # ─── PIB Estadual (Anual) ───────────────────────────────────────
  - name: coletor-to-ter-03-pib-estadual
    id_fonte: "TO-TER-03"
    schedule: "0 4 15 12 *"      # 15 de dezembro às 04h
    timezone: "America/Araguaina"
    retry_count: 3
    retry_interval: "10m"
    timeout: "10m"
    command: "python -m src.cli coletar --fonte TO-TER-03 --ambiente prod"

  # ─── Malha Territorial (Anual) ──────────────────────────────────
  - name: coletor-to-ter-04-malha-territorial
    id_fonte: "TO-TER-04"
    schedule: "0 3 1 3 *"        # 1º de março às 03h (publicação IBGE ~março)
    timezone: "America/Araguaina"
    retry_count: 3
    retry_interval: "10m"
    timeout: "10m"
    command: "python -m src.cli coletar --fonte TO-TER-04 --ambiente prod"

  # ─── PAM - Produção Agrícola Municipal (Anual) ──────────────────
  - name: coletor-to-ter-05-pam
    id_fonte: "TO-TER-05"
    schedule: "0 3 15 9 *"       # 15 de setembro às 03h (publicação ~set)
    timezone: "America/Araguaina"
    retry_count: 3
    retry_interval: "10m"
    timeout: "10m"
    command: "python -m src.cli coletar --fonte TO-TER-05 --ambiente prod"

  # ─── PPM - Pecuária Municipal (Anual) ───────────────────────────
  - name: coletor-to-ter-06-ppm
    id_fonte: "TO-TER-06"
    schedule: "0 4 15 9 *"       # 15 de setembro às 04h
    timezone: "America/Araguaina"
    retry_count: 3
    retry_interval: "10m"
    timeout: "10m"
    command: "python -m src.cli coletar --fonte TO-TER-06 --ambiente prod"

  # ─── PNADC - Desocupação (Trimestral) ───────────────────────────
  - name: coletor-to-ter-07-pnadc
    id_fonte: "TO-TER-07"
    schedule: "0 3 1 */3 *"      # 1º dia a cada 3 meses às 03h
    timezone: "America/Araguaina"
    retry_count: 3
    retry_interval: "10m"
    timeout: "10m"
    command: "python -m src.cli coletar --fonte TO-TER-07 --ambiente prod"

  # ─── INEP / IDEB (Bienal / Anual) ────────────────────────────────
  - name: coletor-to-edu-01-ideb
    id_fonte: "TO-EDU-01"
    schedule: "0 3 1 10 *"       # 1º de outubro às 03h
    timezone: "America/Araguaina"
    retry_count: 3
    retry_interval: "10m"
    timeout: "10m"
    command: "python -m src.cli coletar --fonte TO-EDU-01 --ambiente prod"

  # ─── FNDE Repasses (Anual) ──────────────────────────────────────
  - name: coletor-to-edu-02-fnde
    id_fonte: "TO-EDU-02"
    schedule: "0 4 1 2 *"        # 1º de fevereiro às 04h
    timezone: "America/Araguaina"
    retry_count: 3
    retry_interval: "10m"
    timeout: "10m"
    command: "python -m src.cli coletar --fonte TO-EDU-02 --ambiente prod"

  # ─── Novo CAGED (Mensal) ────────────────────────────────────────
  - name: coletor-to-trab-01-caged
    id_fonte: "TO-TRAB-01"
    schedule: "0 3 5 * *"        # Dia 5 de cada mês às 03h
    timezone: "America/Araguaina"
    retry_count: 3
    retry_interval: "10m"
    timeout: "10m"
    command: "python -m src.cli coletar --fonte TO-TRAB-01 --ambiente prod"

  # ─── Comex Stat Balança Comercial (Anual) ────────────────────────
  - name: coletor-to-eco-01-comex
    id_fonte: "TO-ECO-01"
    schedule: "0 3 15 1 *"       # 15 de janeiro às 03h
    timezone: "America/Araguaina"

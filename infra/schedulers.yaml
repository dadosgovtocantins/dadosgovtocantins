  # ─── CNES Leitos SUS (Mensal) ────────────────────────────────────
  - name: coletor-to-sau-01-leitos
    id_fonte: "TO-SAU-01"
    schedule: "0 3 10 * *"       # Dia 10 de cada mês às 03h
    timezone: "America/Araguaina"

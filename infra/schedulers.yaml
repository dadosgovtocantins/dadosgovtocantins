  # ─── CAPAG Tesouro Nacional (Anual) ─────────────────────────────
  - name: coletor-to-rec-03-capag
    id_fonte: "TO-REC-03"
    schedule: "0 5 1 5 *"        # 1º de maio às 05h
    timezone: "America/Araguaina"

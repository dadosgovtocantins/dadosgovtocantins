  # ─── PNI Cobertura Vacinal (Anual) ───────────────────────────────
  - name: coletor-to-sau-02-pni
    id_fonte: "TO-SAU-02"
    schedule: "0 4 15 4 *"       # 15 de abril às 04h
    timezone: "America/Araguaina"
    retry_count: 3

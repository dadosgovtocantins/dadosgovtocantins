name: Sonda de alcance

# SÓ MANUAL (Actions > Sonda de alcance > Run workflow). Testa, a partir do runner do GitHub, se as fontes
# federais respondem (geobloqueio, WAF, TLS). Task 35, passo 1: o resultado decide se a coleta diária cabe aqui.
# O relatório JSON sai no log, entre BEGIN_ALCANCE_JSON e END_ALCANCE_JSON, e a tabela vai para o resumo da
# execução. Uma requisição leve por endereço; nada é gravado no repositório.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alcance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Instalar dependências (do lock)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://pypi.org/simple -r requirements.lock.txt

      - name: Sonda de alcance
        run: python scripts/testar_alcance.py --origem github-actions --resumo-md "${GITHUB_STEP_SUMMARY}" --imprimir-json

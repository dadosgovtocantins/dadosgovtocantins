name: Verificar fontes

# Rotina diária (14h de Brasília = 17h UTC): consulta a sentinela de cada fonte, coleta só o que tem novidade,
# valida e commita src/ui/data/estado_fontes.json (sempre) e painel_dados.json (só se houver dado novo aceito).
# Manual: Actions > Verificar fontes > Run workflow, com "forcar" = id(s) separados por vírgula ou "todas".
# O commit do robô usa [skip ci] e, por ser feito com o GITHUB_TOKEN, não dispara outros workflows.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Coletar mesmo sem novidade: ids separados por vírgula (ex.: TO-TER-04) ou "todas". Vazio = rotina normal.'
        required: false
        default: ""
        type: string

permissions:
  contents: write # commit dos dados
  issues: write # alertas das fontes com problema

concurrency:
  group: verificar
  cancel-in-progress: false # nunca cancela uma coleta em andamento: a seguinte espera

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Instalar dependências (do lock)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://pypi.org/simple -r requirements.lock.txt

      - name: Verificar e coletar
        id: atualizar
        env:
          FORCAR: ${{ inputs.forcar }} # por variável de ambiente, nunca dentro do script do shell (injeção)
        run: |
          set -euo pipefail
          if [ -n "${FORCAR}" ]; then
            python scripts/atualizar.py --forcar="${FORCAR}"
          else
            python scripts/atualizar.py
          fi

      - name: Commitar os dados
        if: ${{ !cancelled() && steps.atualizar.outcome == 'success' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/data/estado_fontes.json src/ui/data/painel_dados.json
          if git diff --cached --quiet; then
            echo "Nada a commitar."
            exit 0
          fi
          git commit -m "dados: verificação diária das fontes [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Abrir e fechar as issues de alerta
        if: ${{ !cancelled() && steps.atualizar.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sincronizar_issues.py

      - name: Publicar o site no repositório público
        if: ${{ !cancelled() && steps.atualizar.outcome == 'success' }}
        env:
          # Token fine-grained só do repositório público, só "contents: write". Sem ele a publicação fica desligada.
          PAT_PUBLICACAO_PAINEL: ${{ secrets.PAT_PUBLICACAO_PAINEL }}
          PADRAO_EMAIL_INFRA: ${{ secrets.PADRAO_EMAIL_INFRA }}
          REPOSITORIO_PUBLICO: dadosgovtocantins/painel
        run: |
          set -euo pipefail
          if [ -z "${PAT_PUBLICACAO_PAINEL}" ]; then
            echo "Publicação desligada: o segredo PAT_PUBLICACAO_PAINEL não existe."
            exit 0
          fi
          bash scripts/publicar_site.sh "https://github.com/${REPOSITORIO_PUBLICO}.git" main

name: CI

# Repositório PRIVADO no plano gratuito do GitHub. Segundo o Bruno (21/10/2026), esse plano não oferece
# proteção de branch nem rulesets para repositório privado (a documentação consultada não confirma nem nega).
# Por isso a validação (lint + testes + segredos) roda OBRIGATORIAMENTE em todo push, em qualquer branch,
# e em todo pull request: ninguém precisa "lembrar" de rodar. Commits de dados do robô usarão [skip ci] (task 35).
# Um segredo commitado fica no histórico para sempre: o job "segredos" varre TODOS os commits.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1" # segunda, 9h de Brasília: avisos de vulnerabilidade novos aparecem sem precisar de push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Instalar dependências (do lock) e ferramentas na versão local
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://pypi.org/simple -r requirements.lock.txt
          pip install --index-url https://pypi.org/simple pytest==9.1.1 pytest-cov==7.1.0 ruff==0.16.7

      - name: Lint
        run: ruff check src tests scripts

      - name: Formatação
        run: ruff format --check src tests scripts

      - name: Testes
        run: pytest -q --cov=src --cov-report=term-missing

  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Auditoria de vulnerabilidades do lock (S14)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://pypi.org/simple pip-audit==2.10.1
          pip-audit -r requirements.lock.txt --no-deps --disable-pip

  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 do gitleaks_8.30.1_linux_x64.tar.gz (conferido no checksums.txt da release oficial)
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # histórico completo: segredo antigo também é segredo vazado

      - name: Baixar o gitleaks (versão e checksum fixos)
        run: |
          set -euo pipefail
          arq="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${arq}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${arq}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${arq}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${arq}" -C "${RUNNER_TEMP}" gitleaks
          echo "GITLEAKS_BIN=${RUNNER_TEMP}/gitleaks" >> "${GITHUB_ENV}"

      - name: Varredura de segredos no histórico inteiro e padrão do e-mail de infraestrutura
        env:
          PADRAO_EMAIL_INFRA: ${{ secrets.PADRAO_EMAIL_INFRA }}
        run: bash scripts/varrer_segredos.sh

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # SHA-256 do actionlint_1.7.12_linux_amd64.tar.gz (conferido no checksums.txt da release oficial)
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Baixar o actionlint (versão e checksum fixos)
        run: |
          set -euo pipefail
          arq="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${arq}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${arq}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${arq}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${arq}" -C "${RUNNER_TEMP}" actionlint
          echo "ACTIONLINT_BIN=${RUNNER_TEMP}/actionlint" >> "${GITHUB_ENV}"

      - name: Validar os workflows
        run: '"${ACTIONLINT_BIN}" -color'
